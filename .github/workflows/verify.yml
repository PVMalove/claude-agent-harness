name: verify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Bootstrap harness environment
        run: make bootstrap
      - name: Make script executable
        run: chmod +x scripts/verify.py
      - name: Verify harness and clean-room install
        run: make verify
      - name: Check public Git metadata
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          .harness/.venv/bin/python scripts/check_public_metadata.py --commit-range "$COMMIT_RANGE" --pr-body-file "$RUNNER_TEMP/pr-body.md"
      - name: Diff coverage of changed Python lines
        if: github.event_name == 'pull_request'
        env:
          DIFF_COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: .harness/.venv/bin/python scripts/diff_coverage.py

  verify-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Bootstrap harness environment
        run: make bootstrap
      - name: Verify harness and clean-room install
        run: make verify

  repo-map-bundle:
    # Real tree-sitter bundle path (ADR 0024): pinned wheels -> sha256 check -> offline bundle ->
    # bundle tests (never skipped here, never a `pytest -k` filter) and the separate mypy run of
    # the tree-sitter worker. Go, Java and C# each get their own isolated matrix leg and test file
    # (#279): an unavailable bundle or an empty collection fails that leg hard, never a silent skip.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python-ts-js
            test_files: >-
              tests/test_repo_map_tree_sitter.py tests/test_repo_map.py tests/test_parser_bundle.py
              tests/test_repo_map_tree_sitter_unsupported.py tests/test_repo_map_tree_sitter_determinism.py
          - language: go
            test_files: tests/test_repo_map_tree_sitter_go.py
          - language: java
            test_files: tests/test_repo_map_tree_sitter_java.py
          - language: csharp
            test_files: tests/test_repo_map_tree_sitter_csharp.py
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Bootstrap harness environment
        run: make bootstrap
      - name: Download pinned parser wheels and verify sha256
        run: |
          mkdir -p "$RUNNER_TEMP/wheels"
          grep -v '^#' .github/parser-bundle-wheels.txt | while read -r sha url; do
            [ -n "$sha" ] || continue
            file="$RUNNER_TEMP/wheels/$(basename "$url")"
            curl --fail --silent --show-error --location --output "$file" "$url"
            echo "$sha  $file" | sha256sum --check --strict
          done
      - name: Assemble offline parser bundle
        run: .harness/.venv/bin/python scripts/build_parser_bundle.py --wheelhouse "$RUNNER_TEMP/wheels" --out "$RUNNER_TEMP/parser-bundle"
      - name: Repo Map tests against the real bundle
        env:
          HARNESS_PARSER_BUNDLE_DIR: ${{ runner.temp }}/parser-bundle
          PYTHONPATH: .
        run: .harness/.venv/bin/python -m pytest -q ${{ matrix.test_files }}
      - name: Separate mypy run of the tree-sitter worker
        if: matrix.language == 'python-ts-js'
        run: |
          uv venv --python .harness/.venv/bin/python "$RUNNER_TEMP/worker-typecheck"
          # Exactly the wheels pinned in .github/parser-bundle-wheels.txt and sha256-checked above,
          # so the typecheck environment cannot drift from the bundle under test.
          uv pip install --offline --no-config --no-index --only-binary :all: \
            --python "$RUNNER_TEMP/worker-typecheck/bin/python" \
            "$RUNNER_TEMP"/wheels/*.whl
          .harness/.venv/bin/python -m mypy --strict --disallow-any-explicit \
            --python-executable "$RUNNER_TEMP/worker-typecheck/bin/python" \
            harness/repo_map/tree_sitter_worker.py
