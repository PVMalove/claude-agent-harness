name: release

on:
  push:
    # A merge into master publishes the version in harness/VERSION once, when its tag is new.
    branches: [master]
    # Strict vMAJOR.MINOR.PATCH, the only form build_release.py accepts.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The release tag: the pushed tag, or v<harness/VERSION> for a master push. A master push whose
  # tag already exists publishes nothing. Tag, version and CHANGELOG are then checked in seconds,
  # before the full verify run.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Resolve release tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
            publish=true
          else
            tag="v$(tr -d '[:space:]' < harness/VERSION)"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag already exists; nothing to publish."
              publish=false
            else
              publish=true
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Check tag, version, and release notes
        if: steps.tag.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG" --check

  verify:
    needs: preflight
    if: needs.preflight.outputs.publish == 'true'
    uses: ./.github/workflows/verify.yml

  release:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build archive, checksum, and release notes
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release"
      # For a master push the tag does not exist yet: gh creates it on the verified commit.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            "$RUNNER_TEMP/release/claude-agent-harness-$RELEASE_TAG.tar.gz" \
            "$RUNNER_TEMP/release/claude-agent-harness-$RELEASE_TAG.tar.gz.sha256" \
            --notes-file "$RUNNER_TEMP/release/$RELEASE_TAG-release-notes.md"
