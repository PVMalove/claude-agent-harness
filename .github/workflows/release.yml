name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build archive, checksum, and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build_release.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/release"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/release/claude-agent-harness-$RELEASE_TAG.tar.gz" \
            "$RUNNER_TEMP/release/claude-agent-harness-$RELEASE_TAG.tar.gz.sha256" \
            --notes-file "$RUNNER_TEMP/release/$RELEASE_TAG-release-notes.md" \
            --verify-tag
