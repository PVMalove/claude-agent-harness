name: release-parser-bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag pointing to this workflow commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  assemble:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install pinned release verification tools
        run: |
          uv venv "$RUNNER_TEMP/release-tools"
          uv pip install --python "$RUNNER_TEMP/release-tools/bin/python" \
            cyclonedx-bom==7.4.0 pip-audit==2.10.1
          echo "$RUNNER_TEMP/release-tools/bin" >> "$GITHUB_PATH"
      - name: Download and verify every pinned binary wheel
        run: |
          mkdir -p "$RUNNER_TEMP/staged-wheels"
          jq -r '.wheels[] | [.sha256, .url] | @tsv' \
            .github/parser-bundle-release-wheels.json |
          while IFS=$'\t' read -r sha url; do
            file="$RUNNER_TEMP/staged-wheels/$(basename "$url")"
            curl --fail --silent --show-error --location --output "$file" "$url"
            echo "$sha  $file" | sha256sum --check --strict
          done
      - name: Assemble, SBOM, and audit release bundle
        run: |
          python scripts/release_parser_bundle.py \
            --wheelhouse "$RUNNER_TEMP/staged-wheels" \
            --out "$RUNNER_TEMP/parser-bundle-release"
      - name: Upload audited parser bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-bundle-release
          path: ${{ runner.temp }}/parser-bundle-release
          if-no-files-found: error
      - name: Publish audited bundle as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [ "$tag_commit" != "$GITHUB_SHA" ]; then
            echo "Release tag must point to the checked-out commit" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName > /dev/null
          tar -C "$RUNNER_TEMP/parser-bundle-release" -czf "$RUNNER_TEMP/parser-bundle.tar.gz" .
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/parser-bundle.tar.gz"
