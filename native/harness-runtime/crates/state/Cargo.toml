[package]
name = "state"
description = "Runtime store of harness-runtime: schema, canonical JSON, legacy import, parity and cutover (ADR 0020)"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { version = "0.1.0", path = "../contracts" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["hostname", "signal"] }

[target.'cfg(windows)'.dependencies]
platform-ffi = { version = "0.1.0", path = "../platform-ffi" }
