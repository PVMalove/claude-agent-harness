[package]
name = "platform-ffi"
description = "The one isolated platform FFI module of harness-runtime: Windows named pipes, SIDs, DACLs, job objects and console control events"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# ADR 0022, section 1: `unsafe` lives only in this crate, and only in the `windows` module that
# carries the single `#[allow(unsafe_code)]`. The workspace `forbid` cannot be overridden by an
# `allow`, so this crate does not inherit it.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
