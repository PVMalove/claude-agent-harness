[package]
name = "ipc"
description = "Local IPC server of harness-runtime: Unix domain socket or Windows named pipe, peer and token checks"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
contracts = { version = "0.1.0", path = "../contracts" }
serde_json = "1.0.154"
sha2 = "0.11.1"
state = { version = "0.1.0", path = "../state" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["socket", "user"] }

[target.'cfg(windows)'.dependencies]
platform-ffi = { version = "0.1.0", path = "../platform-ffi" }
