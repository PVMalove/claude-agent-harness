[project]
name = "claude-agent-harness"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "coverage==7.16.1",
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
mypy_path = "."
explicit_package_bases = true
files = ["harness"]

[[tool.mypy.overrides]]
module = [
    "harness.orchestration.ledger",
    "harness.orchestration.qa_lane",
    "harness.orchestration.orca_adapter",
    "harness.orchestration.contract",
    "harness.reporting.delivery_stats",
]
disallow_any_explicit = false
