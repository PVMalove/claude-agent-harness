[project]
name = "claude-agent-harness"
version = "1.2.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==2.3.1",
    "coverage==7.16.1",
]

[tool.setuptools]
# The repository is a toolkit, not an installable distribution: `pip install .[dev]` exists only to
# get the dev tools, so opt out of setuptools' flat-layout auto-discovery (it rejects several
# top-level directories).
py-modules = []

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
mypy_path = "."
explicit_package_bases = true
files = [
    "harness",
    "tests",
    "scripts/verify",
    "scripts/check-public-metadata.py",
    "skills/first-party/pvmalove/qa-gate/scripts/test_summary.py",
]
